# Windows build na GitHub-u: Actions → "Windows build" → Run workflow
# (ili push taga v*). Gotov .exe je u "Artifacts" na dnu stranice run-a.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: Spakuj
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/audio-tag-editor.exe, README.md, LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: audio-tag-editor-windows-x64
          path: dist
