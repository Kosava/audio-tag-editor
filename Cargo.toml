[package]
name = "audio-tag-editor"
version = "2.0.0"
edition = "2021"
description = "Editor audio tagova (MP3, FLAC, OGG, Opus, M4A) sa MusicBrainz pretragom"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.18"
lofty = "0.25"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
ureq = "3"
serde_json = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
